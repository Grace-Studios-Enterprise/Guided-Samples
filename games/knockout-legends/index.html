<title>Knockout Legends</title>

<meta name="description" content="A browser boxing game inspired by Fight Night Champion, built with React and Three.js.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: full-bleed WebGL arena; a broadcast-style HUD floats over it (fight-card plates top, prompts center, controls bottom). */
:root{
  --ink:#06070b;          /* arena dark */
  --panel:rgba(9,11,17,.82);
  --panel-solid:#0d1018;
  --line:rgba(241,237,228,.14);
  --bone:#f1ede4;         /* canvas / text */
  --mute:#9b9aa3;
  --gold:#e3b04b;         /* championship belt */
  --red:#d8323f;          /* red corner */
  --blue:#3f86e8;         /* blue corner */
  --good:#58c27d;
  --font-display:'Anton',Impact,'Arial Narrow Bold',sans-serif;
  --font-ui:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Barlow',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--bone);overflow:hidden}
body{font-family:var(--font-body);-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:fixed;inset:0;background:var(--ink)}
#gl{display:block;width:100%;height:100%;outline:none}
#hud{position:fixed;inset:0;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 14px)}
#hud *{box-sizing:border-box}
.pe{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.boot{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--font-ui);letter-spacing:.2em;color:var(--mute);text-transform:uppercase;font-size:13px}

/* ---------- top fight bar */
.bar-top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;max-width:1100px;margin:0 auto}
.plate{display:flex;flex-direction:column;gap:5px;min-width:0}
.plate.right{align-items:flex-end;text-align:right}
.plate .nm{font-family:var(--font-display);font-size:clamp(18px,2.6vw,28px);line-height:1;letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.plate .nk{font-family:var(--font-ui);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.plate .nk b{display:inline-block;width:8px;height:8px;border-radius:1px;margin-right:6px;vertical-align:1px}
.meter{position:relative;height:12px;width:min(380px,100%);background:rgba(255,255,255,.06);border:1px solid var(--line);overflow:hidden;transform:skewX(-14deg)}
.plate.right .meter{transform:skewX(14deg) scaleX(-1)}
.meter.thin{height:6px}
.meter i{position:absolute;left:0;top:0;bottom:0;transition:width .18s linear}
.meter .cap{background:rgba(255,255,255,.12)}
.meter .hp{background:linear-gradient(90deg,#c9c2b3,var(--bone))}
.meter .hp.low{background:linear-gradient(90deg,#8d1d25,var(--red))}
.meter .bd{background:#a9b3c4}
.meter .st{background:linear-gradient(90deg,#9b6f20,var(--gold))}
.meter-row{display:flex;gap:8px;align-items:center;font-family:var(--font-ui);font-size:10px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;width:min(420px,100%)}
.plate.right .meter-row{flex-direction:row-reverse}
.meter-row span{width:34px;flex:none}
.kds{display:flex;gap:4px}
.kds i{width:7px;height:7px;background:var(--red);transform:rotate(45deg)}
.clock{background:var(--panel);border:1px solid var(--line);padding:6px 14px 7px;text-align:center;font-family:var(--font-ui);min-width:96px}
.clock .rd{font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:700;text-transform:uppercase}
.clock .t{font-family:var(--font-display);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:.03em}

/* ---------- center messages */
.msgs{position:fixed;left:0;right:0;top:34%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.msg{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.04em;line-height:1;text-shadow:0 4px 24px rgba(0,0,0,.7);animation:pop .9s cubic-bezier(.2,.9,.2,1) both}
.msg.big{font-size:clamp(44px,9vw,104px);color:var(--bone)}
.msg.gold{color:var(--gold)}
.msg.red{color:var(--red)}
.msg.small{font-size:clamp(20px,3vw,30px);color:var(--gold)}
@keyframes pop{0%{opacity:0;transform:scale(1.5) skewX(-8deg)}18%{opacity:1;transform:scale(1) skewX(-8deg)}75%{opacity:1}100%{opacity:0;transform:scale(.98) skewX(-8deg)}}
@media (prefers-reduced-motion:reduce){.msg{animation:none}}

.count{position:fixed;left:0;right:0;top:20%;text-align:center;pointer-events:none}
.count .n{font-family:var(--font-display);font-size:clamp(90px,18vw,190px);line-height:1;color:var(--bone);text-shadow:0 6px 40px rgba(0,0,0,.8)}
.count .lbl{font-family:var(--font-ui);letter-spacing:.3em;font-weight:700;text-transform:uppercase;color:var(--gold);font-size:14px}
.mash{margin:14px auto 0;width:min(360px,80vw);display:flex;flex-direction:column;gap:8px;align-items:center;font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.16em;font-size:13px}
.mash .meter{width:100%;height:14px}

/* ---------- panels */
.sheet{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.card{pointer-events:auto;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);padding:22px 24px;width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--font-ui);font-weight:700;letter-spacing:.24em;text-transform:uppercase;font-size:12px;color:var(--gold)}
.h1{font-family:var(--font-display);font-size:clamp(34px,6vw,54px);line-height:.95;text-wrap:balance;letter-spacing:.01em}
.h2{font-family:var(--font-display);font-size:26px;line-height:1;letter-spacing:.02em}
.p{color:var(--mute);line-height:1.5;font-size:14px;max-width:62ch}
table.stats{width:100%;border-collapse:collapse;font-family:var(--font-ui);font-size:15px;font-variant-numeric:tabular-nums}
table.stats th,table.stats td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.stats th{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--mute)}
table.stats td:first-child,table.stats th:first-child{text-align:left}
table.stats td:not(:first-child),table.stats th:not(:first-child){text-align:center;width:28%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--gold);color:#17120a;border:0;padding:12px 20px;font-family:var(--font-display);font-size:20px;letter-spacing:.06em;text-transform:uppercase;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--bone);border:1px solid var(--line);clip-path:none;font-family:var(--font-ui);font-weight:700;font-size:15px;letter-spacing:.14em;padding:11px 16px}

/* ---------- menu */
.menu{position:fixed;top:0;bottom:0;left:0;width:min(520px,100%);pointer-events:auto;overflow:auto;
  background:linear-gradient(90deg,rgba(6,7,11,.96) 0%,rgba(6,7,11,.9) 70%,rgba(6,7,11,0) 100%);
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 28px) calc(env(safe-area-inset-bottom,0px) + 28px);
  display:flex;flex-direction:column;gap:22px}
.logo{font-family:var(--font-display);font-size:clamp(48px,9vw,78px);line-height:.86;letter-spacing:.005em;text-transform:uppercase}
.logo em{font-style:normal;color:var(--gold);display:block}
.tape{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 12px;font-family:var(--font-ui);font-size:15px;font-variant-numeric:tabular-nums}
.tape .hd{font-family:var(--font-display);font-size:22px;line-height:1.05;letter-spacing:.02em}
.tape .hd small{display:block;font-family:var(--font-ui);font-size:12px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;font-weight:600}
.tape .l{text-align:right}
.tape .m{text-align:center;color:var(--mute);font-size:11px;letter-spacing:.18em;text-transform:uppercase;align-self:center}
.tape .sep{grid-column:1/-1;height:1px;background:var(--line);margin:4px 0}
.opt{display:flex;flex-direction:column;gap:7px}
.opt label{font-family:var(--font-ui);font-weight:700;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.seg{display:flex;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;border:0;padding:9px 6px;font-family:var(--font-ui);font-weight:600;font-size:15px;letter-spacing:.06em;color:var(--mute);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--bone);color:var(--ink)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-family:var(--font-ui);font-size:14px;color:var(--mute)}
.keys kbd{font-family:var(--font-ui);font-weight:700;color:var(--bone);letter-spacing:.06em}
.foot{font-size:12px;color:var(--mute);line-height:1.5;max-width:52ch}

/* ---------- in-fight hints */
.hint{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-family:var(--font-ui);font-size:12px;letter-spacing:.08em;color:rgba(241,237,228,.62);display:flex;gap:14px;flex-wrap:wrap;max-width:calc(100% - 32px)}
.hint kbd{font-family:var(--font-ui);font-weight:700;color:var(--bone);border:1px solid var(--line);padding:1px 5px;margin-right:4px}

/* ---------- touch */
.touch{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.stick{pointer-events:auto;width:132px;height:132px;border-radius:50%;border:1px solid var(--line);background:rgba(9,11,17,.35);position:relative;touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(241,237,228,.28)}
.pad{pointer-events:auto;display:grid;grid-template-columns:repeat(3,58px);gap:8px;touch-action:none}
.pad button{height:52px;border:1px solid var(--line);background:rgba(9,11,17,.55);font-family:var(--font-ui);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--bone)}
.pad button.on{background:var(--gold);color:var(--ink)}
.pad .wide{grid-column:span 3;height:44px}

.pausebtn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:auto;background:var(--panel);border:1px solid var(--line);padding:6px 12px;font-family:var(--font-ui);font-weight:700;letter-spacing:.14em;font-size:12px;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 52px);transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:8px 14px;font-family:var(--font-ui);font-size:14px;max-width:calc(100% - 32px)}
.touchmode .pausebtn{top:calc(env(safe-area-inset-top,0px) + 96px);bottom:auto}

/* ---------- live editor */
.le{position:fixed;top:0;bottom:0;right:0;width:min(420px,100%);pointer-events:auto;background:rgba(9,11,17,.94);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:5;
  padding-right:env(safe-area-inset-right,0px);padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px)}
.le header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px 10px;border-bottom:1px solid var(--line)}
.le header b{font-family:var(--font-display);font-size:20px;letter-spacing:.03em}
.le header small{font-family:var(--font-ui);color:var(--mute);letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.le .tabs{display:flex;border-bottom:1px solid var(--line)}
.le .tabs button{flex:1;background:none;border:0;padding:10px 4px;font-family:var(--font-ui);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--mute);border-bottom:2px solid transparent}
.le .tabs button[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--gold)}
.le .body{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.le label.f{display:grid;grid-template-columns:110px 1fr 64px;gap:8px;align-items:center;font-family:var(--font-ui);font-size:13px;color:var(--mute)}
.le label.f.wide{grid-template-columns:110px 1fr}
.le input,.le select,.le textarea{background:#05060a;color:var(--bone);border:1px solid var(--line);font:inherit;font-size:13px;padding:5px 6px;min-width:0}
.le input[type=range]{padding:0;accent-color:var(--gold)}
.le input[type=color]{padding:0;height:28px;width:100%}
.le textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.45;min-height:220px;resize:vertical;tab-size:2}
.le .log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:#cfd3dc}
.le .log span{color:var(--mute)}
.le .note{font-size:12px;color:var(--mute);line-height:1.45}
.le .mini{background:transparent;border:1px solid var(--line);color:var(--bone);font-family:var(--font-ui);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:7px 10px}
.le .mini.go{background:var(--gold);color:#17120a;border-color:var(--gold)}
.lebtn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 110px);pointer-events:auto;background:var(--panel);border:1px solid var(--line);padding:5px 10px;font-family:var(--font-ui);font-weight:700;letter-spacing:.12em;font-size:11px;text-transform:uppercase;color:var(--mute)}
@media (max-width:640px){
  .bar-top{grid-template-columns:1fr auto 1fr;gap:6px}
  .clock{min-width:72px;padding:4px 8px}
  .clock .t{font-size:22px}
  .plate .nk{display:none}
  .menu{background:rgba(6,7,11,.9)}
}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* =========================================================================
   utils
   ========================================================================= */
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const ease = (t) => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const angDamp = (a, b, l, dt) => { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return a + d * (1 - Math.exp(-l * dt)); };
const UP = V(0, 1, 0);
const safeStore = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

try { await Promise.race([Promise.all([document.fonts.load('64px Anton'), document.fonts.load('600 22px "Barlow Condensed"')]), new Promise(r => setTimeout(r, 1500))]); } catch {}

/* =========================================================================
   renderer + post
   ========================================================================= */
const QUALITY = {
  perf:  { label: 'Performance', pr: 1,    px: 1.3e6, shadow: 1024, ao: false, dof: false, bloom: false, crowd: .45, tv: false },
  high:  { label: 'High',        pr: 1.5,  px: 2.6e6, shadow: 2048, ao: true,  dof: true,  bloom: true,  crowd: .8,  tv: true },
  ultra: { label: 'Ultra',       pr: 2,    px: 4.5e6, shadow: 4096, ao: true,  dof: true,  bloom: true,  crowd: 1,   tv: true },
};
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030409);
scene.fog = new THREE.FogExp2(0x05060c, 0.03);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 140);
camera.position.set(4, 2.2, 4);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const msaaRT = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, msaaRT);
composer.addPass(new RenderPass(scene, camera));
const FX = []; // additive effects that must not write depth/normals for AO and depth of field
const hideFX = (pass) => { const r = pass.render.bind(pass); pass.render = (...a) => { FX.forEach((o) => (o.userData.v = o.visible, o.visible = false)); r(...a); FX.forEach((o) => (o.visible = o.userData.v)); }; return pass; };
const gtao = hideFX(new GTAOPass(scene, camera, innerWidth, innerHeight));
gtao.updateGtaoMaterial({ radius: .32, distanceExponent: 1, thickness: 1, scale: 1.15, samples: 16, distanceFallOff: 1, screenSpaceRadius: false });
gtao.blendIntensity = .9;
composer.addPass(gtao);
// guard: one NaN/Inf pixel fed into bloom spreads over the whole frame and turns it black
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
    void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb;
      if (any(isnan(c)) || any(isinf(c))) c = vec3(0.0);
      gl_FragColor = vec4(clamp(c, 0.0, 40.0), 1.0); }`,
}));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.55, 0.85);
const bokeh = hideFX(new BokehPass(scene, camera, { focus: 3, aperture: .0022, maxblur: .011 }));
bokeh.enabled = false;
composer.addPass(bokeh);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, flash: { value: 0 }, hurt: { value: 0 }, desat: { value: 0 }, ca: { value: 1 }, grain: { value: .03 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float time, flash, hurt, desat, ca, grain; varying vec2 vUv;
    void main(){
      vec2 c = vUv - 0.5; float r = length(c);
      float k = (0.004 + hurt * 0.014) * ca * r;
      vec3 col = vec3(texture2D(tDiffuse, vUv - c * k * 2.0).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv + c * k * 2.0).b);
      if (hurt > 0.02) {
        vec3 b = vec3(0.0);
        for (int i = 0; i < 6; i++) { float a = float(i) * 1.0472 + time * 3.0; b += texture2D(tDiffuse, vUv + vec2(cos(a), sin(a)) * 0.007 * hurt).rgb; }

    <div className="h2">Paused</div>
    ${s.autoPaused && html`<div className="p">The game lost keyboard focus, so it paused itself. Click Resume to get back in the ring.</div>`}
    <div className="row"><button className="btn" onClick=${() => game.togglePause()}>Resume</button><button className="btn ghost" onClick=${() => game.menu()}>Quit to menu</button></div>
  </div></div>`;
}
function Result({ s }) {
  if (s.overT < 2.4) return null;
  const r = s.result;
  const head = r.type === 'DEC' ? (r.winner ? `${r.winner} wins` : 'Draw') : `${r.type}! ${r.winner}`;
  return html`<div className="sheet"><div className="card">
    <div className="eyebrow">${r.kind} · Round ${r.round}${r.type !== 'DEC' ? ', ' + r.clock : ''}</div>
    <div className="h1" style=${{ color: r.playerWon ? 'var(--gold)' : 'var(--bone)' }}>${head}</div>
    ${r.totals && html`<div style=${{ overflowX: 'auto' }}><table className="stats"><thead><tr><th>Scorecard</th><th>${s.p.last}</th><th>${s.o.last}</th></tr></thead><tbody>
      ${r.totals.map((t, i) => html`<tr key=${i}><td>Judge ${i + 1}</td><td>${t[0]}</td><td>${t[1]}</td></tr>`)}
    </tbody></table></div>`}
    <div style=${{ overflowX: 'auto' }}><table className="stats"><thead><tr><th>Fight totals</th><th>${s.p.last}</th><th>${s.o.last}</th></tr></thead><tbody>
      ${statRows(s.p.stats, s.o.stats).map(([l, x, y]) => html`<tr key=${l}><td>${l}</td><td>${x}</td><td>${y}</td></tr>`)}
    </tbody></table></div>
    <div className="row"><button className="btn" onClick=${() => game.start()}>Rematch</button><button className="btn ghost" onClick=${() => game.menu()}>Main menu</button></div>
  </div></div>`;
}
function Touch() {
  const stick = useRef(null), knob = useRef(null), id = useRef(null);
  const move = (e) => {
    if (id.current !== e.pointerId) return;
    const r = stick.current.getBoundingClientRect();
    let x = (e.clientX - r.left - r.width / 2) / (r.width / 2), y = (e.clientY - r.top - r.height / 2) / (r.height / 2);
    const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
    knob.current.style.transform = `translate(${x * 40}px,${y * 40}px)`;
    game.touchMove(Math.abs(x) > .2 ? x : 0, Math.abs(y) > .2 ? y : 0);
  };
  const end = () => { id.current = null; knob.current.style.transform = ''; game.touchMove(0, 0); };
  const [body, setBody] = useState(false);
  const hold = (k) => ({ onPointerDown: (e) => { e.preventDefault(); game.touchHold(k, true); }, onPointerUp: () => game.touchHold(k, false), onPointerLeave: () => game.touchHold(k, false), onPointerCancel: () => game.touchHold(k, false) });
  const p = (b, label) => html`<button onPointerDown=${(e) => { e.preventDefault(); game.punch(b); }}>${label}</button>`;
  return html`<div className="touch">
    <div className="stick" ref=${stick} onPointerDown=${(e) => { id.current = e.pointerId; e.currentTarget.setPointerCapture(e.pointerId); move(e); }} onPointerMove=${move} onPointerUp=${end} onPointerCancel=${end}><i ref=${knob}></i></div>
    <div className="pad">
      ${p('lhook', 'L hook')}${p('jab', 'Jab')}${p('cross', 'Cross')}
      ${p('lupper', 'L upper')}${p('rhook', 'R hook')}${p('rupper', 'R upper')}
      <button ...${hold('block')}>Block</button>
      <button className=${body ? 'on' : ''} onPointerDown=${(e) => { e.preventDefault(); const v = !body; setBody(v); game.touchHold('body', v); }}>Body</button>
      <button onPointerDown=${(e) => { e.preventDefault(); game.slip(Math.random() < .5 ? 1 : -1); }}>Slip</button>
    </div>
  </div>`;
}
function Hint() {
  return html`<div className="hint"><span><kbd>J</kbd><kbd>K</kbd>straights</span><span><kbd>U</kbd><kbd>I</kbd>hooks</span><span><kbd>N</kbd><kbd>M</kbd>uppercuts</span><span><kbd>Shift</kbd>body</span><span><kbd>Space</kbd>block</span><span><kbd>Q</kbd><kbd>E</kbd>slip</span></div>`;
}
function LiveEditor({ s }) {
  const [tab, setTab] = useState('tables');
  const [tname, setT] = useState('fighters');
  const [rec, setRec] = useState(1);
  const [code, setCode] = useState(LE_EXAMPLES['Log every event']);
  const [pname, setPname] = useState('my look');
  const [io, setIo] = useState('');
  const t = LE.db.GetTable(tname), n = t.GetRecordCount(), r = Math.min(rec, n);
  const set = (f, v) => { try { t.SetRecordFieldValue(r, f, v); } catch (err) { leLog(String(err.message)); } };
  const presets = Object.keys(LE.presets());
  const copy = (text) => { const done = () => leLog('copied to clipboard'); try { navigator.clipboard.writeText(text).then(done, () => setIo(text)); } catch { setIo(text); } };
  return html`<aside className="le" aria-label="Live editor">
    <header><div><b>Live Editor</b><br/><small>v${LE.version.editor} · schema ${LE.version.schema} · F1 to close</small></div><button className="mini" onClick=${() => game.toggleEditor()}>Close</button></header>
    <div className="tabs" role="tablist">${['tables', 'scripts', 'presets', 'log'].map((k) => html`<button key=${k} role="tab" aria-selected=${String(tab === k)} onClick=${() => setTab(k)}>${k}</button>`)}</div>
    <div className="body">
      ${tab === 'tables' && html`<${React.Fragment}>
        <label className="f wide">Table<select id="le-table" value=${tname} onChange=${(e) => { setT(e.target.value); setRec(1); }}>${LE.db.GetTableNames().map((x) => html`<option key=${x} value=${x}>${x}</option>`)}</select></label>
        ${n > 1 && html`<label className="f wide">Record<select id="le-rec" value=${r} onChange=${(e) => setRec(+e.target.value)}>${Array.from({ length: n }, (_, i) => html`<option key=${i} value=${i + 1}>${i + 1} · ${t.GetRecordLabel(i + 1)}</option>`)}</select></label>`}
        ${LE_TABLES[tname].note && html`<div className="note">${LE_TABLES[tname].note}</div>`}
        ${t.GetFields().map((f) => {
          const d = LE_TABLES[tname].fields[f], v = t.GetRecordFieldValue(r, f), id = `le-${tname}-${f}`;
          if (d.ro) return html`<label key=${f} className="f wide">${f}<input id=${id} value=${String(v)} readOnly/></label>`;
          if (d.type === 'color') return html`<label key=${f} className="f wide">${f}<input id=${id} type="color" value=${v} onInput=${(e) => set(f, e.target.value)}/></label>`;
          if (d.type === 'enum') return html`<label key=${f} className="f wide">${f}<select id=${id} value=${v} onChange=${(e) => set(f, e.target.value)}>${d.options.map((o) => html`<option key=${o} value=${o}>${o}</option>`)}</select></label>`;
          return html`<label key=${f} className="f">${f}<input type="range" aria-label=${f} min=${d.min} max=${d.max} step=${d.step} value=${v} onInput=${(e) => set(f, e.target.value)}/><input id=${id} type="number" min=${d.min} max=${d.max} step=${d.step} value=${+(+v).toFixed(d.step < .01 ? 4 : 2)} onChange=${(e) => e.target.value !== '' && set(f, e.target.value)}/></label>`;
        })}
        <div className="note">Scripts use the same table: <code>LE.db.GetTable('${tname}').SetRecordFieldValue(${r}, '${t.GetFields()[0]}', …)</code></div>
      <//>`}
      ${tab === 'scripts' && html`<${React.Fragment}>
        <label className="f wide">Example<select id="le-example" onChange=${(e) => e.target.value && setCode(LE_EXAMPLES[e.target.value])}><option value="">Pick an example…</option>${Object.keys(LE_EXAMPLES).map((k) => html`<option key=${k} value=${k}>${k}</option>`)}</select></label>
        <textarea id="le-code" spellcheck="false" value=${code} onChange=${(e) => setCode(e.target.value)}></textarea>
        <div className="row"><button className="mini go" onClick=${() => { LE.run(code); setTab('log'); }}>Run</button><button className="mini" onClick=${() => LE.stopScripts()}>Stop all handlers (${LE.handlerCount()})</button></div>
        <div className="note">JavaScript with <code>LE.db</code>, <code>AddEventHandler(name, fn)</code> and <code>log()</code>. Events: fight_start, round_start, round_end, punch_thrown, punch_landed, punch_blocked, knockdown, get_up, fight_over, tick, or '*' for all of them.</div>
      <//>`}
      ${tab === 'presets' && html`<${React.Fragment}>
        <label className="f wide">Name<input id="le-preset-name" value=${pname} onChange=${(e) => setPname(e.target.value)}/></label>
        <div className="row"><button className="mini go" onClick=${() => pname.trim() && LE.savePreset(pname.trim())}>Save current look</button></div>
        ${presets.length ? presets.map((p) => html`<div key=${p} className="row" style=${{ alignItems: 'center' }}><span style=${{ flex: 1, minWidth: 0 }}>${p}</span><button className="mini" onClick=${() => { try { LE.loadPreset(p); } catch (err) { leLog(String(err.message)); } }}>Load</button><button className="mini" onClick=${() => LE.deletePreset(p)}>Delete</button></div>`) : html`<div className="note">No presets saved yet. Saved presets live in this browser only.</div>`}
        <div className="row"><button className="mini" onClick=${() => copy(JSON.stringify(LE.snapshot(), null, 1))}>Copy current as JSON</button><button className="mini" onClick=${() => { try { LE.apply(JSON.parse(io)); leLog('applied pasted preset'); } catch (err) { leLog('could not apply:', String(err.message)); } }}>Apply pasted JSON</button></div>
        <textarea id="le-preset-io" spellcheck="false" placeholder="Paste a preset here to apply it, or copy one out to share" value=${io} onChange=${(e) => setIo(e.target.value)} style=${{ minHeight: '120px' }}></textarea>
      <//>`}
      ${tab === 'log' && html`<${React.Fragment}>
        <div className="row"><button className="mini" onClick=${() => { LE_LOG.length = 0; }}>Clear</button></div>
        <div className="log" aria-live="polite">${LE_LOG.length ? LE_LOG.slice(-120).map((l, i) => html`<div key=${i}><span>${l.t}</span> ${l.text}</div>`) : 'Nothing logged yet. Run the "Log every event" example, then start a fight.'}</div>
      <//>`}
    </div>
  </aside>`;
}
function App() {
  const [s, setS] = useState(game.snapshot());
  useEffect(() => { const t = setInterval(() => setS(game.snapshot()), 50); return () => clearInterval(t); }, []);
  const inFight = ['intro', 'fight', 'break', 'paused', 'over'].includes(s.mode);
  return html`<div className=${s.touch ? 'touchmode' : ''}>
    ${s.mode === 'menu' && html`<${Menu} s=${s}/>`}
    ${inFight && html`<${TopBar} s=${s}/>`}
    ${s.mode === 'intro' && html`<${Intro} s=${s}/>`}
    <${Messages} s=${s}/>
    ${s.kd && html`<${Count} s=${s}/>`}
    ${s.mode === 'break' && html`<${Corner} s=${s}/>`}
    ${s.mode === 'paused' && html`<${Pause} s=${s}/>`}
    ${s.toast && html`<div className="toast" role="status">${s.toast}</div>`}
    ${s.glLost && html`<div className="sheet"><div className="card" style=${{ width: 'min(420px,100%)' }}><div className="h2">The graphics card reset</div><div className="p">Your browser dropped the 3D view, usually from running low on GPU memory. Pick Performance graphics and reload the page.</div><div className="row"><button className="btn" onClick=${() => { game.setOpt('quality', 'perf'); location.reload(); }}>Switch to Performance</button></div></div></div>`}
    ${s.mode === 'over' && s.result && html`<${Result} s=${s}/>`}
    ${s.mode === 'fight' && s.touch && html`<${Touch}/>`}
    ${s.mode === 'fight' && !s.touch && html`<${Hint}/>`}
    ${s.editor && html`<${LiveEditor} s=${s}/>`}
    ${!s.editor && !s.touch && html`<button className="lebtn" onMouseDown=${(e) => e.preventDefault()} onClick=${() => game.toggleEditor()}>Editor · F1</button>`}
    ${s.mode === 'fight' && html`<button className="pausebtn" onMouseDown=${(e) => e.preventDefault()} onClick=${() => game.togglePause()}>Pause</button>`}
  </div>`;
}
const hudEl = document.getElementById('hud');
hudEl.innerHTML = '';
ReactDOM.createRoot(hudEl).render(html`<${App}/>`);
</script>
