<meta name="description" content="A browser boxing game inspired by Fight Night Champion, built with React and Three.js.">

<style>
/* Layout: full-bleed WebGL arena; a broadcast-style HUD floats over it (fight-card plates top, prompts center, controls bottom). */
:root{
  --ink:#06070b;          /* arena dark */
  --panel:rgba(9,11,17,.82);
  --panel-solid:#0d1018;
  --line:rgba(241,237,228,.14);
  --bone:#f1ede4;         /* canvas / text */
  --mute:#9b9aa3;
  --gold:#e3b04b;         /* championship belt */
  --red:#d8323f;          /* red corner */
  --blue:#3f86e8;         /* blue corner */
  --good:#58c27d;
  --font-display:'Anton',Impact,'Arial Narrow Bold',sans-serif;
  --font-ui:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Barlow',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--bone);overflow:hidden}
body{font-family:var(--font-body);-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:fixed;inset:0;background:var(--ink)}
#gl{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 14px)}
#hud *{box-sizing:border-box}
.pe{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.boot{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--font-ui);letter-spacing:.2em;color:var(--mute);text-transform:uppercase;font-size:13px}

/* ---------- top fight bar */
.bar-top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;max-width:1100px;margin:0 auto}
.plate{display:flex;flex-direction:column;gap:5px;min-width:0}
.plate.right{align-items:flex-end;text-align:right}
.plate .nm{font-family:var(--font-display);font-size:clamp(18px,2.6vw,28px);line-height:1;letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.plate .nk{font-family:var(--font-ui);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.plate .nk b{display:inline-block;width:8px;height:8px;border-radius:1px;margin-right:6px;vertical-align:1px}
.meter{position:relative;height:12px;width:min(380px,100%);background:rgba(255,255,255,.06);border:1px solid var(--line);overflow:hidden;transform:skewX(-14deg)}
.plate.right .meter{transform:skewX(14deg) scaleX(-1)}
.meter.thin{height:6px}
.meter i{position:absolute;left:0;top:0;bottom:0;transition:width .18s linear}
.meter .cap{background:rgba(255,255,255,.12)}
.meter .hp{background:linear-gradient(90deg,#c9c2b3,var(--bone))}
.meter .hp.low{background:linear-gradient(90deg,#8d1d25,var(--red))}
.meter .bd{background:#a9b3c4}
.meter .st{background:linear-gradient(90deg,#9b6f20,var(--gold))}
.meter-row{display:flex;gap:8px;align-items:center;font-family:var(--font-ui);font-size:10px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;width:min(420px,100%)}
.plate.right .meter-row{flex-direction:row-reverse}
.meter-row span{width:34px;flex:none}
.kds{display:flex;gap:4px}
.kds i{width:7px;height:7px;background:var(--red);transform:rotate(45deg)}
.clock{background:var(--panel);border:1px solid var(--line);padding:6px 14px 7px;text-align:center;font-family:var(--font-ui);min-width:96px}
.clock .rd{font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:700;text-transform:uppercase}
.clock .t{font-family:var(--font-display);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:.03em}

/* ---------- center messages */
.msgs{position:fixed;left:0;right:0;top:34%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.msg{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.04em;line-height:1;text-shadow:0 4px 24px rgba(0,0,0,.7);animation:pop .9s cubic-bezier(.2,.9,.2,1) both}
.msg.big{font-size:clamp(44px,9vw,104px);color:var(--bone)}
.msg.gold{color:var(--gold)}
.msg.red{color:var(--red)}
.msg.small{font-size:clamp(20px,3vw,30px);color:var(--gold)}
@keyframes pop{0%{opacity:0;transform:scale(1.5) skewX(-8deg)}18%{opacity:1;transform:scale(1) skewX(-8deg)}75%{opacity:1}100%{opacity:0;transform:scale(.98) skewX(-8deg)}}
@media (prefers-reduced-motion:reduce){.msg{animation:none}}

.count{position:fixed;left:0;right:0;top:20%;text-align:center;pointer-events:none}
.count .n{font-family:var(--font-display);font-size:clamp(90px,18vw,190px);line-height:1;color:var(--bone);text-shadow:0 6px 40px rgba(0,0,0,.8)}
.count .lbl{font-family:var(--font-ui);letter-spacing:.3em;font-weight:700;text-transform:uppercase;color:var(--gold);font-size:14px}
.mash{margin:14px auto 0;width:min(360px,80vw);display:flex;flex-direction:column;gap:8px;align-items:center;font-family:var(--font-ui);text-transform:uppercase;letter-spacing:.16em;font-size:13px}
.mash .meter{width:100%;height:14px}

/* ---------- panels */
.sheet{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.card{pointer-events:auto;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);padding:22px 24px;width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--font-ui);font-weight:700;letter-spacing:.24em;text-transform:uppercase;font-size:12px;color:var(--gold)}
.h1{font-family:var(--font-display);font-size:clamp(34px,6vw,54px);line-height:.95;text-wrap:balance;letter-spacing:.01em}
.h2{font-family:var(--font-display);font-size:26px;line-height:1;letter-spacing:.02em}
.p{color:var(--mute);line-height:1.5;font-size:14px;max-width:62ch}
table.stats{width:100%;border-collapse:collapse;font-family:var(--font-ui);font-size:15px;font-variant-numeric:tabular-nums}
table.stats th,table.stats td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.stats th{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--mute)}
table.stats td:first-child,table.stats th:first-child{text-align:left}
table.stats td:not(:first-child),table.stats th:not(:first-child){text-align:center;width:28%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--gold);color:#17120a;border:0;padding:12px 20px;font-family:var(--font-display);font-size:20px;letter-spacing:.06em;text-transform:uppercase;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--bone);border:1px solid var(--line);clip-path:none;font-family:var(--font-ui);font-weight:700;font-size:15px;letter-spacing:.14em;padding:11px 16px}

/* ---------- menu */
.menu{position:fixed;top:0;bottom:0;left:0;width:min(520px,100%);pointer-events:auto;overflow:auto;
  background:linear-gradient(90deg,rgba(6,7,11,.96) 0%,rgba(6,7,11,.9) 70%,rgba(6,7,11,0) 100%);
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 28px) calc(env(safe-area-inset-bottom,0px) + 28px);
  display:flex;flex-direction:column;gap:22px}
.logo{font-family:var(--font-display);font-size:clamp(48px,9vw,78px);line-height:.86;letter-spacing:.005em;text-transform:uppercase}
.logo em{font-style:normal;color:var(--gold);display:block}
.tape{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 12px;font-family:var(--font-ui);font-size:15px;font-variant-numeric:tabular-nums}
.tape .hd{font-family:var(--font-display);font-size:22px;line-height:1.05;letter-spacing:.02em}
.tape .hd small{display:block;font-family:var(--font-ui);font-size:12px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;font-weight:600}
.tape .l{text-align:right}
.tape .m{text-align:center;color:var(--mute);font-size:11px;letter-spacing:.18em;text-transform:uppercase;align-self:center}
.tape .sep{grid-column:1/-1;height:1px;background:var(--line);margin:4px 0}
.opt{display:flex;flex-direction:column;gap:7px}
.opt label{font-family:var(--font-ui);font-weight:700;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.seg{display:flex;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;border:0;padding:9px 6px;font-family:var(--font-ui);font-weight:600;font-size:15px;letter-spacing:.06em;color:var(--mute);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--bone);color:var(--ink)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-family:var(--font-ui);font-size:14px;color:var(--mute)}
.keys kbd{font-family:var(--font-ui);font-weight:700;color:var(--bone);letter-spacing:.06em}
.foot{font-size:12px;color:var(--mute);line-height:1.5;max-width:52ch}

/* ---------- in-fight hints */
.hint{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-family:var(--font-ui);font-size:12px;letter-spacing:.08em;color:rgba(241,237,228,.62);display:flex;gap:14px;flex-wrap:wrap;max-width:calc(100% - 32px)}
.hint kbd{font-family:var(--font-ui);font-weight:700;color:var(--bone);border:1px solid var(--line);padding:1px 5px;margin-right:4px}

/* ---------- touch */
.touch{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.stick{pointer-events:auto;width:132px;height:132px;border-radius:50%;border:1px solid var(--line);background:rgba(9,11,17,.35);position:relative;touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(241,237,228,.28)}
.pad{pointer-events:auto;display:grid;grid-template-columns:repeat(3,58px);gap:8px;touch-action:none}
.pad button{height:52px;border:1px solid var(--line);background:rgba(9,11,17,.55);font-family:var(--font-ui);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--bone)}
.pad button.on{background:var(--gold);color:var(--ink)}
.pad .wide{grid-column:span 3;height:44px}

.pausebtn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:auto;background:var(--panel);border:1px solid var(--line);padding:6px 12px;font-family:var(--font-ui);font-weight:700;letter-spacing:.14em;font-size:12px;text-transform:uppercase}
.touchmode .pausebtn{top:calc(env(safe-area-inset-top,0px) + 96px);bottom:auto}

@media (max-width:640px){
  .bar-top{grid-template-columns:1fr auto 1fr;gap:6px}
  .clock{min-width:72px;padding:4px 8px}
  .clock .t{font-size:22px}
  .plate .nk{display:none}
  .menu{background:rgba(6,7,11,.9)}
}
</style>

<script type="module">

/* =========================================================================

   ========================================================================= */

/* =========================================================================

   ========================================================================= */
const QUALITY = {
  perf:  { label: 'Performance', pr: 1,    px: 1.3e6, shadow: 1024, bloom: false, crowd: .45, tv: false },
  high:  { label: 'High',        pr: 1.5,  px: 2.6e6, shadow: 2048, bloom: true,  crowd: .8,  tv: true },
  ultra: { label: 'Ultra',       pr: 2,    px: 4.5e6, shadow: 4096, bloom: true,  crowd: 1,   tv: true },

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030409);
scene.fog = new THREE.FogExp2(0x05060c, 0.03);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 140);
camera.position.set(4, 2.2, 4);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const msaaRT = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, msaaRT);
composer.addPass(new RenderPass(scene, camera));
// guard: one NaN/Inf pixel fed into bloom spreads over the whole frame and turns it black
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,

    void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb;

composer.addPass(bloom);

const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, flash: { value: 0 }, hurt: { value: 0 }, desat: { value: 0 }, ca: { value: 1 } },

  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float time, flash, hurt, desat, ca; varying vec2 vUv;
    void main(){

function canvasTex(w, h, draw, { srgb = true, repeat = null } = {}) {

});
const apronTex = canvasTex(1024, 128, (g, w, h) => {
  g.fillStyle = '#0b1530'; g.fillRect(0, 0, w, h); noise(g, w, h, 10);
  g.fillStyle = '#e3b04b'; g.font = '64px Anton, Impact, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';

function msg(text, kind = 'big') { G.msgs.push({ id: ++G.msgId, text, kind, at: performance.now() }); if (G.msgs.length > 8) G.msgs.shift(); }
const dist = (a, b) => Math.hypot(a.pos.x - b.pos.x, a.pos.z - b.pos.z);
const other = (f) => (f === P1 ? P2 : P1);

function startPunch(f, type) {
  if (f.down || f.rising || f.autoTarget || G.mode === 'over') return false;
  if (f.action) { if (f.action.t > f.action.dur * .5 && f.queue.length < 1) f.queue.push(type); return false; }
  if (f.stun > .15) return false;
  const P = PUNCH[type];
  const slow = 1 + (1 - f.stamina / 100) * .4;
  f.action = { type, t: 0, dur: P.dur * slow / f.cfg.speed, hitP: P.hitP, done: false };
  f.stamina = Math.max(0, f.stamina - P.stam);
  f.blocking = false;
  f.stats.thrown++; if (P.power) f.stats.pThrown++;
  sfx.whoosh(P.power ? 1 : .6);
  return true;
}

function resolveHit(att, def, a) {
  const P = PUNCH[a.type];
  if (def.down || def.rising) return;
  const lunge = P.kind === 'straight' ? .1 : .05;
  if (dist(att, def) > P.reach + lunge) return; // whiff
  const toHead = !P.body;
  if (toHead && def.slip > .05 && P.kind !== 'upper' && (P.kind === 'straight' || Math.random() < .5)) {
    def.counterWin = .7;
    if (def.isPlayer && G.mode === 'fight') msg('Slipped', 'small');
    return;
  }
  const isCounter = (def.action && !def.action.done) || att.counterWin > 0;
  const blocked = def.blocking && (toHead ? !def.blockLow : def.blockLow);
  const dirX = def.pos.x - att.pos.x, dirZ = def.pos.z - att.pos.z, dl = Math.hypot(dirX, dirZ) || 1;
  _d.set(dirX / dl, 0, dirZ / dl);
  if (blocked) {
    def.stamina = Math.max(0, def.stamina - P.dmg * .45);
    def.rec.vp -= 1.5; att.rec.vp += .8;
    spray.burst(toHead ? def.headWorld : def.chestWorld, _d, 4, .5);
    sfx.block(); return;
  }

  if (isCounter) { dmg *= 1.55; att.counterWin = 0; }
  if (def.stun > 0) dmg *= 1.15;
  if (def.blocking) dmg *= .8; // guard in the wrong place still absorbs a bit
  if (G.mode === 'fight') dmg *= def.isPlayer ? DIFF[G.difficulty].dealt : DIFF[G.difficulty].taken;
  if (toHead) dmg /= def.cfg.chin;
  att.stats.landed++; if (P.power) att.stats.pLanded++; att.stats.dmg += dmg;
  const k = dmg / 7;
  // reaction springs: hooks turn the head, uppercuts lift the chin, straights snap it back
  const side = P.hand;
  if (toHead) {
    if (P.kind === 'hook') { def.rec.vy += side * 9 * k; def.rec.vr += side * 4 * k; def.rec.vp -= 2 * k; }
    else if (P.kind === 'upper') { def.rec.vp -= 11 * k; }

  // effects
  spray.burst(toHead ? def.headWorld : def.chestWorld, _d, Math.round(10 + k * 26), .6 + k * .5);
  const toCam = def.isPlayer || att.isPlayer;
  G.shake = Math.max(G.shake, (toCam ? .05 : .02) * k);
  if (def.isPlayer) G.flash = Math.max(G.flash, .08 * k);
  sfx.punch(k);
  G.excite = Math.min(1, G.excite + .08 * k + (isCounter ? .15 : 0));
  if (k > .9) { sfx.roar(Math.min(1, k * .6)); for (let i = 0; i < 4; i++) spawnFlash(); }
  def.lastHitAt = G.time;
  if (def.invuln) return;

  else { def.body -= dmg; def.bodyMax = Math.max(18, def.bodyMax - dmg * .22); def.stamina = Math.max(0, def.stamina - dmg * .8); }

}

function knockdown(def, att, P) {

  def.kdRound++; def.kdTotal++; att.stats.kd++;
  att.action = null; att.queue.length = 0;

  G.kd = { victim: def, attacker: att, t: 0, count: 0, mash: 0, need: Math.round(7 + def.kdTotal * 4 + (1 - def.headMax / 100) * 12), aiRise: Math.random() < aiRiseChance ? 3 + ((Math.random() * 6) | 0) : 99, tko: def.kdRound >= 3 };

}

/* --------------------------------------------------------------------------- AI */
function aiUpdate(f, o, dt, skill) {
  const a = f.ai;
  if (f.down || f.rising || f.autoTarget || o.down || o.rising) { f.blocking = false; f.input.fwd = o.down ? -.6 : 0; f.input.side = 0; return; }
  const d = dist(f, o);
  a.t -= dt; a.blockT -= dt; a.strafeT -= dt;
  let want = a.pref;
  if (f.stamina < 28) want = 1.35;
  if (o.head < 30 || o.wobble > .4) want = .95; // smell blood
  f.input.fwd = clamp((d - want) * 2.6, -1, 1);
  if (a.strafeT <= 0) { a.strafe = Math.random() < .65 ? rand(-1, 1) : 0; a.strafeT = rand(.5, 1.8); a.pref = rand(.95, 1.15); }
  f.input.side = a.strafe;
  // escape the ropes
  if (Math.hypot(f.pos.x, f.pos.z) > BOUND - .3) f.input.side = (a.strafe >= 0 ? 1 : -1);
  // defence: react to incoming punches after a reaction delay
  if (o.action && !o.action.done) {
    if (a.reacted !== o.action) { a.reacted = o.action; a.reactAt = skill.react + rand(0, .12); }
  }
  if (a.reactAt != null && a.reacted === o.action && o.action) {
    a.reactAt -= dt;
    if (a.reactAt <= 0) {
      a.reactAt = null;
      const r = Math.random(), P = PUNCH[o.action.type];
      if (r < skill.block && !f.action) { a.blockT = .42; f.blockLow = P.body; }
      else if (r < skill.block + skill.slip && !P.body && !f.action) { f.slip = .38; f.slipDir = Math.random() < .5 ? 1 : -1; a.counterNext = true; }
    }
  }
  if (f.head < 28 && !f.action && Math.random() < dt * 1.5) { a.blockT = Math.max(a.blockT, .7); f.blockLow = false; }
  f.blocking = a.blockT > 0 && !f.action;
  // offence
  if (!f.action && !f.queue.length && a.t <= 0 && d < 1.12 && !f.blocking && f.stamina > 8 && f.stun <= 0) {
    if (Math.random() < skill.aggr || a.counterNext) {
      const pool = Math.random() < skill.combo ? COMBOS : COMBOS.filter((c) => c.length === 1 || (c.length === 2 && Math.random() < .5));
      const combo = pick(pool.length ? pool : COMBOS);
      if (startPunch(f, combo[0])) f.queue.push(...combo.slice(1));
      a.counterNext = false;
    }
    a.t = rand(.3, 1.0) * (1.45 - skill.aggr);
  }
}

/* --------------------------------------------------------------------------- player input */
const keys = new Set();
const KEYMAP = { KeyJ: 'jab', KeyK: 'cross', KeyU: 'lhook', KeyI: 'rhook', KeyN: 'lupper', KeyM: 'rupper' };
const touch = { fwd: 0, side: 0, block: false, body: false };
function playerPunch(base) {
  if (G.kd && G.kd.victim === P1) { G.kd.mash += 1; return; }
  if (G.mode !== 'fight') return;
  const body = keys.has('ShiftLeft') || keys.has('ShiftRight') || touch.body || pad.body;
  startPunch(P1, base + (body ? '_b' : ''));
}
function playerSlip(dir) { if (G.mode !== 'fight' || P1.action || P1.down || P1.slip > 0 || P1.stamina < 3) return; P1.slip = .38; P1.slipDir = dir; P1.stamina -= 2.5; }
addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys.add(e.code);
  if (KEYMAP[e.code]) playerPunch(KEYMAP[e.code]);
  else if (e.code === 'Space' && G.kd && G.kd.victim === P1) G.kd.mash += 1;
  else if (e.code === 'KeyQ') playerSlip(1);
  else if (e.code === 'KeyE') playerSlip(-1);
  else if (e.code === 'KeyC') game.setOpt('cam', G.cam === 'broadcast' ? 'side' : 'broadcast');
  else if (e.code === 'KeyP' || e.code === 'Escape') game.togglePause();
  else if (e.code === 'Enter') { if (G.mode === 'intro') G.introT = 99; else if (G.mode === 'break' && G.breakT > 1.5) G.breakT = 99; }
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

// gamepad: left stick moves, right stick flicks throw punches (total punch control style)
const pad = { body: false, last: [], rsArmed: true };
function pollPad() {
  const gp = navigator.getGamepads ? [...navigator.getGamepads()].find(Boolean) : null;
  if (!gp) return null;
  const b = (i) => !!gp.buttons[i]?.pressed;
  const was = pad.last;
  const edge = (i) => b(i) && !was[i];
  pad.body = b(7);
  if (edge(9)) game.togglePause();
  if (edge(2)) playerPunch(b(5) ? 'lupper' : 'jab');
  if (edge(3)) playerPunch(b(5) ? 'rupper' : 'cross');
  if (edge(0)) playerPunch('lhook');
  if (edge(1)) playerPunch('rhook');
  const rx = gp.axes[2] || 0, ry = gp.axes[3] || 0, rm = Math.hypot(rx, ry);
  if (rm < .3) pad.rsArmed = true;
  else if (rm > .8 && pad.rsArmed) {
    pad.rsArmed = false;
    const ang = Math.atan2(-ry, rx) * 180 / Math.PI; // 90 = up
    if (ang > 100 && ang <= 150) playerPunch('jab');
    else if (ang > 30 && ang <= 80) playerPunch('cross');
    else if (ang > 150 || ang <= -150) playerPunch('lhook');
    else if (ang > -30 && ang <= 30) playerPunch('rhook');
    else if (ang > -150 && ang <= -95) playerPunch('lupper');
    else if (ang > -85 && ang <= -30) playerPunch('rupper');
    else playerPunch('jab');
  }
  const lx = gp.axes[0] || 0, ly = gp.axes[1] || 0;
  if (edge(4)) playerSlip(lx < 0 ? 1 : -1);
  pad.last = gp.buttons.map((x) => x.pressed);
  return { fwd: Math.abs(ly) > .18 ? -ly : 0, side: Math.abs(lx) > .18 ? lx : 0, block: b(6) };
}

function playerInput() {
  const gp = pollPad();
  let fwd = 0, side = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) fwd += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) fwd -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) side += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) side -= 1;
  fwd += touch.fwd; side += touch.side;
  if (gp) { fwd += gp.fwd; side += gp.side; }
  P1.input.fwd = clamp(fwd, -1, 1); P1.input.side = clamp(side, -1, 1);
  const block = keys.has('Space') || keys.has('KeyL') || touch.block || (gp && gp.block);
  P1.blocking = !!block && !P1.action && !P1.down;
  P1.blockLow = keys.has('ShiftLeft') || keys.has('ShiftRight') || touch.body || pad.body;
}

/* --------------------------------------------------------------------------- simulation */
function updateFighter(f, o, dt) {
  // spring for hit reactions
  const r = f.rec;

    G.introT += rdt; P1.input.fwd = P2.input.fwd = 0; P1.input.side = P2.input.side = 0;

  } else if (G.mode === 'over') {

  // atmosphere
  G.excite = Math.max(.12, G.excite - rdt * .12);

  for (const f of flashes) if (f.life > 0) { f.life -= rdt; if (f.life <= 0) f.s.visible = false; }

  spray.update(dt);

  for (let i = 0; i < dp.count; i++) { let y = dp.getY(i) + rdt * .05; if (y > 9) y = .2; dp.setY(i, y); dp.setX(i, dp.getX(i) + Math.sin(G.time * .3 + i) * rdt * .02); }

  updateCamera(rdt);
  const hurt = G.mode === 'fight' || G.kd ? clamp((35 - Math.max(0, P1.head)) / 35, 0, 1) * .85 + (P1.down ? .3 : 0) : 0;
  grade.uniforms.time.value = now / 1000;
  grade.uniforms.hurt.value = damp(grade.uniforms.hurt.value, Math.min(1, hurt + P1.wobble * .35), 3, rdt);
  grade.uniforms.desat.value = damp(grade.uniforms.desat.value, G.timeScale < .5 ? .55 : (G.mode === 'paused' ? .6 : 0), 6, rdt);

}

function applyQuality() {
  const q = QUALITY[G.quality];

}

addEventListener('resize', onResize);

  menu() { G.mode = 'menu'; G.result = null; G.kd = null; G.cine = null; G.slow = 0; resetFighter(P1, 0, -1.0, true); resetFighter(P2, 0, 1.0, true); },

function Touch() {
