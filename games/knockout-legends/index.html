<title>Knockout Legends</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A street boxing game in the spirit of NBA Street, built with React and Three.js.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Permanent+Marker&family=UnifrakturMaguntia&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed night street venue in WebGL; a sticker-and-spray-paint HUD floats over it
   (fighter plates with breaker meters top, callouts center, controls bottom). Single dark look by design. */
:root{
  --ink:#0c0a14;            /* night asphalt */
  --panel:rgba(16,12,26,.9);
  --line:rgba(255,246,232,.18);
  --bone:#fff6e8;           /* chalk white */
  --mute:#b9afc8;
  --sun:#ffc93c;            /* spray-can yellow */
  --hot:#ff3d7f;            /* neon pink */
  --cyan:#2be4ff;           /* neon cyan */
  --red:#ff4a3d;            /* red corner */
  --blue:#2f8bff;           /* blue corner */
  --tar:#000;               /* sticker outline */
  --font-display:'Bungee',Impact,'Arial Black',sans-serif;
  --font-tag:'Permanent Marker','Comic Sans MS',cursive;
  --font-ui:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Barlow',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--bone);overflow:hidden}
body{font-family:var(--font-body);-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:fixed;inset:0;background:var(--ink)}
#gl{display:block;width:100%;height:100%;outline:none}
#hud{position:fixed;inset:0;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px)}
#hud *{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.boot{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--font-display);letter-spacing:.08em;color:var(--sun);font-size:16px;text-shadow:3px 3px 0 var(--tar)}

/* ---------- stickers */
.sticker{background:var(--panel);border:3px solid var(--tar);box-shadow:5px 5px 0 var(--tar)}
.tag{font-family:var(--font-tag);font-weight:400;letter-spacing:.02em}

/* ---------- top fight bar */
.bar-top{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;max-width:1160px;margin:0 auto}
.plate{display:flex;flex-direction:column;gap:6px;min-width:0}
.plate.right{align-items:flex-end;text-align:right}
.plate .nm{font-family:var(--font-display);font-size:clamp(18px,2.6vw,30px);line-height:1;color:var(--bone);text-shadow:3px 3px 0 var(--tar);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.plate .nk{font-family:var(--font-tag);font-size:16px;line-height:1;transform:rotate(-3deg);text-shadow:2px 2px 0 var(--tar)}
.plate.right .nk{transform:rotate(3deg)}
.meter{position:relative;height:16px;width:min(390px,100%);background:#1a1426;border:3px solid var(--tar);box-shadow:3px 3px 0 var(--tar);overflow:hidden;transform:skewX(-16deg)}
.plate.right .meter{transform:skewX(16deg) scaleX(-1)}
.meter.thin{height:10px;box-shadow:2px 2px 0 var(--tar);border-width:2px}
.meter i{position:absolute;left:0;top:0;bottom:0;transition:width .15s linear}
.meter .cap{background:rgba(255,255,255,.14)}
.meter .hp{background:linear-gradient(180deg,#fff6e8,#ffd9a8)}
.meter .hp.low{background:linear-gradient(180deg,#ff7a6e,var(--red));animation:throb .6s ease-in-out infinite alternate}
.meter .bd{background:linear-gradient(180deg,#c8f6ff,#7bd2ef)}
.meter .st{background:linear-gradient(180deg,#ffe48a,var(--sun))}
@keyframes throb{to{filter:brightness(1.4)}}
.meter-row{display:flex;gap:8px;align-items:center;font-family:var(--font-ui);font-weight:800;font-size:11px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase;width:min(440px,100%)}
.plate.right .meter-row{flex-direction:row-reverse}
.meter-row span{width:36px;flex:none}
.breaker{display:flex;gap:4px;align-items:center;transform:skewX(-16deg)}
.plate.right .breaker{transform:skewX(16deg);flex-direction:row-reverse}
.breaker i{width:28px;height:14px;background:#1a1426;border:2px solid var(--tar);position:relative;overflow:hidden}
.breaker i b{position:absolute;inset:0;background:linear-gradient(90deg,var(--hot),var(--sun));transform-origin:left;display:block}
.plate.right .breaker i b{transform-origin:right}
.breaker span{font-family:var(--font-display);font-size:12px;margin:0 6px;color:var(--mute);transform:skewX(16deg)}
.plate.right .breaker span{transform:skewX(-16deg)}
.breaker.ready i b{animation:flame .35s steps(2) infinite}
.breaker.ready span{color:var(--sun);text-shadow:0 0 12px var(--hot)}
@keyframes flame{50%{filter:hue-rotate(-25deg) brightness(1.4)}}
.kds{display:flex;gap:5px}
.kds i{width:9px;height:9px;background:var(--hot);border:2px solid var(--tar);transform:rotate(45deg)}
.clock{text-align:center;font-family:var(--font-ui);min-width:104px;padding:6px 14px 8px;transform:rotate(-2deg);background:var(--sun);color:var(--tar);border:3px solid var(--tar);box-shadow:5px 5px 0 var(--tar)}
.clock .rd{font-family:var(--font-display);font-size:12px;letter-spacing:.06em}
.clock .t{font-family:var(--font-display);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.combo{font-family:var(--font-display);font-size:22px;color:var(--sun);text-shadow:3px 3px 0 var(--tar);transform:rotate(-4deg)}
.plate.right .combo{transform:rotate(4deg)}

/* ---------- callouts */
.msgs{position:fixed;left:0;right:0;top:30%;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;padding-inline:16px;text-align:center}
.msg{font-family:var(--font-display);text-transform:uppercase;line-height:.95;animation:pop 1.1s cubic-bezier(.2,.9,.2,1) both;-webkit-text-stroke:2px var(--tar);text-shadow:5px 5px 0 var(--tar);max-width:100%}
.msg.big{font-size:clamp(40px,8.5vw,104px);color:var(--bone)}
.msg.gold{color:var(--sun)}
.msg.call{font-size:clamp(24px,4.2vw,46px);color:var(--cyan)}
.msg.hot{font-size:clamp(26px,4.6vw,52px);color:var(--hot)}
.msg.breaker{font-size:clamp(46px,10vw,124px);color:var(--sun);text-shadow:6px 6px 0 var(--hot),12px 12px 0 var(--tar)}
.msg.small{font-family:var(--font-tag);-webkit-text-stroke:0;font-size:clamp(22px,3.2vw,34px);color:var(--sun);text-transform:none;text-shadow:3px 3px 0 var(--tar)}
@keyframes pop{0%{opacity:0;transform:scale(1.7) rotate(-6deg)}16%{opacity:1;transform:scale(1) rotate(-3deg)}78%{opacity:1}100%{opacity:0;transform:scale(1.02) rotate(-3deg) translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.msg,.breaker.ready i b,.meter .hp.low{animation:none}}

.count{position:fixed;left:0;right:0;top:18%;text-align:center;pointer-events:none}
.count .n{font-family:var(--font-display);font-size:clamp(90px,18vw,190px);line-height:1;color:var(--bone);-webkit-text-stroke:3px var(--tar);text-shadow:8px 8px 0 var(--tar)}
.count .lbl{font-family:var(--font-tag);font-size:24px;color:var(--sun);text-shadow:3px 3px 0 var(--tar)}
.mash{margin:14px auto 0;width:min(360px,80vw);display:flex;flex-direction:column;gap:8px;align-items:center;font-family:var(--font-display);font-size:14px;text-shadow:2px 2px 0 var(--tar)}
.mash .meter{width:100%;height:18px}

/* ---------- panels */
.sheet{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.card{pointer-events:auto;padding:22px 24px;width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--font-tag);font-size:18px;color:var(--sun);line-height:1.1}
.h1{font-family:var(--font-display);font-size:clamp(32px,6vw,54px);line-height:.95;text-wrap:balance;text-shadow:4px 4px 0 var(--tar)}
.h2{font-family:var(--font-display);font-size:26px;line-height:1;text-shadow:3px 3px 0 var(--tar)}
.p{color:var(--mute);line-height:1.5;font-size:14px;max-width:62ch}
table.stats{width:100%;border-collapse:collapse;font-family:var(--font-ui);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
table.stats th,table.stats td{padding:6px 4px;border-bottom:2px dashed var(--line)}
table.stats th{font-family:var(--font-display);font-weight:400;font-size:12px;color:var(--mute)}
table.stats td:first-child,table.stats th:first-child{text-align:left}
table.stats td:not(:first-child),table.stats th:not(:first-child){text-align:center;width:28%}
.row{display:flex;gap:12px;flex-wrap:wrap}
.btn{background:var(--sun);color:var(--tar);border:3px solid var(--tar);box-shadow:5px 5px 0 var(--tar);padding:10px 20px;font-family:var(--font-display);font-size:20px;transform:rotate(-2deg);transition:transform .1s}
.btn:hover{transform:rotate(-2deg) translate(-2px,-2px);box-shadow:7px 7px 0 var(--tar)}
.btn:active{transform:rotate(-2deg) translate(3px,3px);box-shadow:2px 2px 0 var(--tar)}
.btn.ghost{background:var(--panel);color:var(--bone);font-size:15px;transform:rotate(1deg)}
.btn.ghost:hover{transform:rotate(1deg) translate(-2px,-2px)}

/* ---------- menu */
.menu{position:fixed;top:0;bottom:0;left:0;width:min(540px,100%);pointer-events:auto;overflow:auto;
  background:linear-gradient(90deg,rgba(12,10,20,.97) 0%,rgba(12,10,20,.92) 72%,rgba(12,10,20,0) 100%);
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 26px) calc(env(safe-area-inset-bottom,0px) + 26px);
  display:flex;flex-direction:column;gap:20px}
.logo{font-family:var(--font-display);font-size:clamp(46px,9vw,80px);line-height:.88;color:var(--bone);text-shadow:5px 5px 0 var(--hot),10px 10px 0 var(--tar)}
.logo em{font-style:normal;display:block;color:var(--sun)}
.logo .street{font-family:var(--font-tag);font-size:.5em;color:var(--cyan);display:inline-block;transform:rotate(-8deg) translate(4px,-6px);text-shadow:3px 3px 0 var(--tar)}
.tape{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 12px;font-family:var(--font-ui);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;padding:16px}
.tape .hd{font-family:var(--font-display);font-size:22px;line-height:1.05}
.tape .hd small{display:block;font-family:var(--font-tag);font-size:16px;color:var(--sun)}
.tape .hd.r small{color:var(--cyan)}
.tape .l{text-align:right}
.tape .m{text-align:center;color:var(--mute);font-family:var(--font-display);font-size:10px;align-self:center}
.tape .sep{grid-column:1/-1;height:0;border-top:2px dashed var(--line);margin:6px 0}
.opt{display:flex;flex-direction:column;gap:7px}
.opt label{font-family:var(--font-display);font-size:11px;color:var(--mute)}
.seg{display:flex;border:3px solid var(--tar);box-shadow:4px 4px 0 var(--tar);background:var(--panel)}
.seg button{flex:1;background:transparent;border:0;padding:9px 6px;font-family:var(--font-ui);font-weight:800;font-size:15px;letter-spacing:.04em;color:var(--mute);border-right:2px solid var(--tar)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--cyan);color:var(--tar)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-family:var(--font-ui);font-size:15px;color:var(--mute)}
.keys kbd{font-family:var(--font-display);font-size:12px;color:var(--bone)}
.foot{font-size:12px;color:var(--mute);line-height:1.5;max-width:54ch}

/* ---------- in-fight hints */
.hint{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-family:var(--font-ui);font-weight:700;font-size:13px;color:rgba(255,246,232,.75);display:flex;gap:12px;flex-wrap:wrap;max-width:calc(100% - 140px);text-shadow:1px 1px 0 var(--tar)}
.hint kbd{font-family:var(--font-display);font-size:11px;color:var(--tar);background:var(--bone);border:2px solid var(--tar);padding:0 4px;margin-right:4px}
.hint .hot kbd{background:var(--sun)}

/* ---------- touch */
.touch{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.stick{pointer-events:auto;width:132px;height:132px;border-radius:50%;border:3px solid var(--tar);background:rgba(16,12,26,.45);position:relative;touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:var(--bone);border:3px solid var(--tar)}
.pad{pointer-events:auto;display:grid;grid-template-columns:repeat(3,60px);gap:8px;touch-action:none}
.pad button{height:50px;border:3px solid var(--tar);background:rgba(16,12,26,.75);font-family:var(--font-display);font-size:10px;color:var(--bone);box-shadow:3px 3px 0 var(--tar)}
.pad button.on{background:var(--cyan);color:var(--tar)}
.pad button.go{background:var(--sun);color:var(--tar)}

.pausebtn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:auto;padding:6px 12px;font-family:var(--font-display);font-size:12px;background:var(--panel);border:3px solid var(--tar);box-shadow:3px 3px 0 var(--tar)}
.touchmode .pausebtn{top:calc(env(safe-area-inset-top,0px) + 120px);bottom:auto}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 56px);transform:translateX(-50%) rotate(-1deg);font-family:var(--font-ui);font-weight:700;font-size:14px;padding:8px 14px;max-width:calc(100% - 32px)}
.focus{pointer-events:auto;cursor:pointer;text-align:center}

@media (max-width:640px){
  .bar-top{gap:6px}
  .clock{min-width:74px;padding:4px 8px}
  .clock .t{font-size:22px}
  .plate .nk,.breaker span{display:none}
  .breaker i{width:16px}
  .menu{background:rgba(12,10,20,.92)}
}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* =========================================================================
   utils
   ========================================================================= */
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const ease = (t) => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const angDamp = (a, b, l, dt) => { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return a + d * (1 - Math.exp(-l * dt)); };
const UP = V(0, 1, 0);
const safeStore = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

try { await Promise.race([Promise.all(['64px Bungee', '64px "Permanent Marker"', '64px UnifrakturMaguntia', '600 22px "Barlow Condensed"'].map((f) => document.fonts.load(f))), new Promise(r => setTimeout(r, 2500))]); } catch {}

/* =========================================================================
   renderer + post
   ========================================================================= */
const QUALITY = {
  perf:  { label: 'Smooth', pr: 1,    px: 1.3e6, shadow: 1024, ao: false, dof: false, bloom: false, crowd: .45, tv: false },
  high:  { label: 'High',        pr: 1.5,  px: 2.6e6, shadow: 2048, ao: true,  dof: true,  bloom: true,  crowd: .8,  tv: true },
  ultra: { label: 'Max',       pr: 2,    px: 4.5e6, shadow: 4096, ao: true,  dof: true,  bloom: true,  crowd: 1,   tv: true },
};
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030409);
scene.fog = new THREE.FogExp2(0x05060c, 0.03);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 140);
camera.position.set(4, 2.2, 4);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const msaaRT = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, msaaRT);
composer.addPass(new RenderPass(scene, camera));
const FX = []; // additive effects that must not write depth/normals for AO and depth of field
const hideFX = (pass) => { const r = pass.render.bind(pass); pass.render = (...a) => { FX.forEach((o) => (o.userData.v = o.visible, o.visible = false)); r(...a); FX.forEach((o) => (o.visible = o.userData.v)); }; return pass; };
const gtao = hideFX(new GTAOPass(scene, camera, innerWidth, innerHeight));
gtao.updateGtaoMaterial({ radius: .32, distanceExponent: 1, thickness: 1, scale: 1.15, samples: 16, distanceFallOff: 1, screenSpaceRadius: false });
gtao.blendIntensity = .9;
composer.addPass(gtao);
// guard: one NaN/Inf pixel fed into bloom spreads over the whole frame and turns it black
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
    void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb;
      if (any(isnan(c)) || any(isinf(c))) c = vec3(0.0);
      gl_FragColor = vec4(clamp(c, 0.0, 40.0), 1.0); }`,
}));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.55, 0.85);
const bokeh = hideFX(new BokehPass(scene, camera, { focus: 3, aperture: .0022, maxblur: .011 }));
bokeh.enabled = false;
composer.addPass(bokeh);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, flash: { value: 0 }, hurt: { value: 0 }, desat: { value: 0 }, ca: { value: 1 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float time, flash, hurt, desat, ca; varying vec2 vUv;
    void main(){
      vec2 c = vUv - 0.5; float r = length(c);
      float k = (0.004 + hurt * 0.014) * ca * r;
      vec3 col = vec3(texture2D(tDiffuse, vUv - c * k * 2.0).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv + c * k * 2.0).b);
      if (hurt > 0.02) {
        vec3 b = vec3(0.0);
        for (int i = 0; i < 6; i++) { float a = float(i) * 1.0472 + time * 3.0; b += texture2D(tDiffuse, vUv + vec2(cos(a), sin(a)) * 0.007 * hurt).rgb; }
        col = mix(col, b / 6.0, hurt * 0.75);
      }
      float l = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(col, vec3(l), desat);
      col = mix(col, col * vec3(1.04, 0.99, 0.93), 0.6);

function scoreRound() {

  const pts = (x) => x.landed + x.pLanded * 1.5 + x.dmg * .15 + 1;
  const judges = [0, 1, 2].map(() => {
    const pa = pts(a) * rand(.85, 1.15), pb = pts(b) * rand(.85, 1.15);
    let sa = 10, sb = 10;
    if (Math.abs(pa - pb) / Math.max(pa, pb) > .06) { if (pa > pb) sb = 9; else sa = 9; }
    sa -= b.kd; sb -= a.kd;

}

      <kbd>B</kbd><span>Gamebreaker, once the meter is full</span>
      <kbd>C · P · X</kbd><span>Camera · pause · beat on/off</span>
      <kbd>Gamepad</kbd><span>Flick the right stick to punch. L1 + R1 breaks. Click a stick to showboat.</span>
    </div>`}
    <div className="foot">A fan homage to Fight Night Champion and NBA Street, built with React and Three.js. Fighters, venue and names are fictional, and no EA assets are used. Head scan: Lee Perry-Smith by Infinite-Realities, CC BY 3.0.</div>
  </div>`;
}
function Intro({ s }) {
  return html`<div className="sheet"><div className="card sticker" style=${{ width: 'min(480px,100%)', textAlign: 'center', alignItems: 'center' }}>
    <div className="eyebrow">${s.rounds} rounds · street rules</div>
    <div className="h1">${s.p.last} <span style=${{ color: 'var(--hot)' }}>vs</span> ${s.o.last}</div>
    <div className="p">Land combos, slip shots and showboat to fill your breaker. When it's lit, hit B for the Gamebreaker.</div>
    <button className="btn ghost" onClick=${() => game.skipIntro()}>Skip the walkout</button>
  </div></div>`;
}
function statRows(a, b) {
  const pct = (x, y) => (y ? Math.round((x / y) * 100) + '%' : '–');
  return [
    ['Punches landed', `${a.landed}/${a.thrown}`, `${b.landed}/${b.thrown}`],
    ['Connect rate', pct(a.landed, a.thrown), pct(b.landed, b.thrown)],
    ['Power shots', `${a.pLanded}/${a.pThrown}`, `${b.pLanded}/${b.pThrown}`],
    ['Knockdowns', a.kd, b.kd],
  ];
}
function Corner({ s }) {
  const c = s.cards[s.cards.length - 1]; if (!c || s.breakT < 1.5) return null;
  const tot = s.cards.reduce((acc, k) => [acc[0] + k.judges[0][0], acc[1] + k.judges[0][1]], [0, 0]);
  return html`<div className="sheet"><div className="card sticker">
    <div className="eyebrow">Round ${c.round} in the books</div>
    <div className="h2">Corner</div>
    <div style=${{ overflowX: 'auto' }}><table className="stats"><thead><tr><th></th><th>${s.p.last}</th><th>${s.o.last}</th></tr></thead><tbody>
      ${statRows(c.a, c.b).map(([l, x, y]) => html`<tr key=${l}><td>${l}</td><td>${x}</td><td>${y}</td></tr>`)}
      <tr><td>Best combo</td><td>${s.p.bestCombo}</td><td>${s.o.bestCombo}</td></tr>
      <tr><td>Judge 1, this round</td><td>${c.judges[0][0]}</td><td>${c.judges[0][1]}</td></tr>
      <tr><td>Judge 1, total</td><td>${tot[0]}</td><td>${tot[1]}</td></tr>
    </tbody></table></div>
    <div className="p">Your cornerman pours water on your head and yells something about your left hand. Your gas tank refills, but some damage stays.</div>
    <div className="row"><button className="btn" onClick=${() => game.nextRound()}>Round ${c.round + 1}</button></div>
  </div></div>`;
}
function Pause({ s }) {
  return html`<div className="sheet"><div className="card sticker" style=${{ width: 'min(440px,100%)' }}>
    <div className="h2">Paused</div>
    ${s.autoPaused && html`<div className="p">The game lost keyboard focus, so it paused itself. Click Resume to get back in the ring.</div>`}
    <${Settings} s=${s}/>
    <div className="row"><button className="btn" onClick=${() => game.togglePause()}>Resume</button><button className="btn ghost" onClick=${() => game.menu()}>Quit to menu</button></div>
  </div></div>`;
}
function Result({ s }) {
  if (s.overT < 2.4) return null;
  const r = s.result;
  const head = r.type === 'DEC' ? (r.winner ? `${r.winner} takes it` : 'Draw') : `${r.type}! ${r.winner}`;
  return html`<div className="sheet"><div className="card sticker">
    <div className="eyebrow">${r.kind} · Round ${r.round}${r.type !== 'DEC' ? ', ' + r.clock : ''}</div>
    <div className="h1" style=${{ color: r.playerWon ? 'var(--sun)' : 'var(--bone)' }}>${head}</div>
    ${r.totals && html`<div style=${{ overflowX: 'auto' }}><table className="stats"><thead><tr><th>Scorecard</th><th>${s.p.last}</th><th>${s.o.last}</th></tr></thead><tbody>
      ${r.totals.map((t, i) => html`<tr key=${i}><td>Judge ${i + 1}</td><td>${t[0]}</td><td>${t[1]}</td></tr>`)}
    </tbody></table></div>`}
    <div style=${{ overflowX: 'auto' }}><table className="stats"><thead><tr><th>Fight totals</th><th>${s.p.last}</th><th>${s.o.last}</th></tr></thead><tbody>
      ${statRows(s.p.stats, s.o.stats).map(([l, x, y]) => html`<tr key=${l}><td>${l}</td><td>${x}</td><td>${y}</td></tr>`)}
      <tr><td>Best combo</td><td>${s.p.bestCombo}</td><td>${s.o.bestCombo}</td></tr>
    </tbody></table></div>
    <div className="row"><button className="btn" onClick=${() => game.start()}>Run it back</button><button className="btn ghost" onClick=${() => game.menu()}>Main menu</button></div>
  </div></div>`;
}
function Touch({ s }) {
  const stick = useRef(null), knob = useRef(null), id = useRef(null);
  const move = (e) => {
    if (id.current !== e.pointerId) return;
    const r = stick.current.getBoundingClientRect();
    let x = (e.clientX - r.left - r.width / 2) / (r.width / 2), y = (e.clientY - r.top - r.height / 2) / (r.height / 2);
    const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
    knob.current.style.transform = `translate(${x * 40}px,${y * 40}px)`;
    game.touchMove(Math.abs(x) > .2 ? x : 0, Math.abs(y) > .2 ? y : 0);
  };
  const end = () => { id.current = null; knob.current.style.transform = ''; game.touchMove(0, 0); };
  const [body, setBody] = useState(false);
  const hold = (k) => ({ onPointerDown: (e) => { e.preventDefault(); game.touchHold(k, true); }, onPointerUp: () => game.touchHold(k, false), onPointerLeave: () => game.touchHold(k, false), onPointerCancel: () => game.touchHold(k, false) });
  const p = (b, label) => html`<button onPointerDown=${(e) => { e.preventDefault(); game.punch(b); }}>${label}</button>`;
  return html`<div className="touch">
    <div className="stick" ref=${stick} onPointerDown=${(e) => { id.current = e.pointerId; e.currentTarget.setPointerCapture(e.pointerId); move(e); }} onPointerMove=${move} onPointerUp=${end} onPointerCancel=${end}><i ref=${knob}></i></div>
    <div className="pad">
      ${p('lhook', 'L hook')}${p('jab', 'Jab')}${p('cross', 'Cross')}
      ${p('lupper', 'L upper')}${p('rhook', 'R hook')}${p('rupper', 'R upper')}
      <button ...${hold('block')}>Block</button>
      <button className=${body ? 'on' : ''} onPointerDown=${(e) => { e.preventDefault(); const v = !body; setBody(v); game.touchHold('body', v); }}>Body</button>
      <button onPointerDown=${(e) => { e.preventDefault(); game.slip(Math.random() < .5 ? 1 : -1); }}>Slip</button>
      <button onPointerDown=${(e) => { e.preventDefault(); game.taunt(); }}>Show</button>
      <button className=${s.p.style >= STYLE_MAX ? 'go' : ''} style=${{ gridColumn: 'span 2' }} onPointerDown=${(e) => { e.preventDefault(); game.breaker(); }}>Breaker</button>
    </div>
  </div>`;
}
function Hint({ s }) {
  return html`<div className="hint"><span><kbd>J</kbd><kbd>K</kbd>straights</span><span><kbd>U</kbd><kbd>I</kbd>hooks</span><span><kbd>N</kbd><kbd>M</kbd>uppers</span><span><kbd>Shift</kbd>body</span><span><kbd>Space</kbd>block</span><span><kbd>Q</kbd><kbd>E</kbd>slip</span><span><kbd>T</kbd>showboat</span><span className=${s.p.style >= STYLE_MAX ? 'hot' : ''}><kbd>B</kbd>breaker</span></div>`;
}
function App() {
  const [s, setS] = useState(game.snapshot());
  useEffect(() => { const t = setInterval(() => setS(game.snapshot()), 50); return () => clearInterval(t); }, []);
  const inFight = ['intro', 'fight', 'break', 'paused', 'over'].includes(s.mode);
  const noFocus = (e) => e.preventDefault(); // in-fight buttons never keep focus, so Space can't re-press them
  return html`<div className=${s.touch ? 'touchmode' : ''}>
    ${s.mode === 'menu' && html`<${Menu} s=${s}/>`}
    ${inFight && html`<${TopBar} s=${s}/>`}
    ${s.mode === 'intro' && html`<${Intro} s=${s}/>`}
    <${Messages} s=${s}/>
    ${s.kd && html`<${Count} s=${s}/>`}
    ${s.mode === 'break' && html`<${Corner} s=${s}/>`}
    ${s.mode === 'paused' && html`<${Pause} s=${s}/>`}
    ${s.glLost && html`<div className="sheet"><div className="card sticker" style=${{ width: 'min(420px,100%)' }}><div className="h2">The graphics card reset</div><div className="p">Your browser dropped the 3D view, usually because the GPU ran low on memory. Switch to Smooth graphics and reload the page.</div><div className="row"><button className="btn" onClick=${() => { game.setOpt('quality', 'perf'); location.reload(); }}>Switch to Smooth</button></div></div></div>`}
    ${s.mode === 'over' && s.result && html`<${Result} s=${s}/>`}
    ${s.mode === 'fight' && s.touch && html`<${Touch} s=${s}/>`}
    ${s.mode === 'fight' && !s.touch && html`<${Hint} s=${s}/>`}
    ${s.toast && html`<div className="toast sticker" role="status">${s.toast}</div>`}
    ${s.mode === 'fight' && html`<button className="pausebtn" onMouseDown=${noFocus} onClick=${() => game.togglePause()}>Pause</button>`}
  </div>`;
}
const hudEl = document.getElementById('hud');
hudEl.innerHTML = '';
ReactDOM.createRoot(hudEl).render(html`<${App}/>`);
</script>
